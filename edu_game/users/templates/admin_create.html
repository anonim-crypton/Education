<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi Admin Yaratish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(34, 197, 94, 0.06) 0%, transparent 50%);
            animation: bgMove 20s ease-in-out infinite;
        }

        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5%, -5%) rotate(5deg); }
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            border-radius: 16px;
            margin-bottom: 24px;
            position: relative;
        }

        .logo::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            z-index: -1;
            opacity: 0.5;
            filter: blur(10px);
        }

        .logo svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .card-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        .error-message {
            color: var(--accent-red);
            font-size: 0.75rem;
            margin-top: 6px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        input.error {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        /* Success Message */
        .success-container {
            display: none;
            text-align: center;
        }

        .success-container.active {
            display: block;
            animation: fadeInUp 0.6s ease-out;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--accent-green);
        }

        .credentials-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }

        .credential-item {
            margin-bottom: 12px;
        }

        .credential-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .credential-value {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: var(--accent-blue);
            word-break: break-all;
            padding: 8px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-password-btn {
            background: none;
            border: none;
            color: var(--accent-green);
            font-size: 0.7rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toggle-password-btn:hover {
            text-decoration: underline;
        }

        .countdown {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 16px;
        }

        .countdown strong {
            color: var(--accent-green);
            font-size: 1.25rem;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .card {
                padding: 24px;
            }

            .card-header h1 {
                font-size: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>

    <div class="container">
        <div class="card">
            <!-- Header -->
            <div class="card-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1>Yangi Admin Yaratish</h1>
                <p>Tizimga admin hisobi yarating</p>
            </div>

            <!-- Form -->
            <form id="adminForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Admin uchun username"
                        minlength="3"
                        required
                    >
                    <div class="error-message" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Parol</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Kuchli parol kiriting"
                        minlength="6"
                        required
                    >
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="error-message" id="generalError"></div>

                <div class="button-group">
                    <button type="button" class="btn-secondary" id="backBtn">Orqaga</button>
                    <button type="submit" class="btn-primary" id="submitBtn">Yaratish</button>
                </div>
            </form>

            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p class="loading-text">Admin yaratilmoqda...</p>
            </div>

            <!-- Success -->
            <div class="success-container" id="successContainer">
                <div class="success-icon">✓</div>
                <div class="success-title">Muvaffaqiyatli Yaratildi!</div>
                <div class="credentials-box">
                    <div class="credential-item">
                        <div class="credential-label">USERNAME</div>
                        <div class="credential-value">
                            <span id="displayUsername"></span>
                        </div>
                    </div>
                    <div class="credential-item">
                        <div class="credential-label">PAROL</div>
                        <div class="credential-value">
                            <span id="displayPassword"></span>
                            <button type="button" class="toggle-password-btn" id="togglePassword">Ko'rsatish</button>
                        </div>
                    </div>
                </div>
                <p style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 16px;">
                    Bu credentials'ni nohovat saqlang. Admin dashboard'ga kirish uchun ishlating.
                </p>
                <div class="countdown">
                    Admin Dashboard'ga avtomatik yo'naltirish: <strong id="countdown">3</strong>s
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('adminForm');
        const submitBtn = document.getElementById('submitBtn');
        const backBtn = document.getElementById('backBtn');
        const loading = document.getElementById('loading');
        const successContainer = document.getElementById('successContainer');

        // Back button
        backBtn.addEventListener('click', () => {
            window.location.href = '/';
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Clear errors
            document.getElementById('usernameError').classList.remove('active');
            document.getElementById('passwordError').classList.remove('active');
            document.getElementById('generalError').classList.remove('active');
            document.getElementById('username').classList.remove('error');
            document.getElementById('password').classList.remove('error');

            // Get values
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            let hasError = false;

            // Validate
            if (!username) {
                showError('usernameError', 'Username majburiy');
                document.getElementById('username').classList.add('error');
                hasError = true;
            }
            if (username.length < 3) {
                showError('usernameError', 'Username kamida 3 ta belgidan iborat bo\'lishi kerak');
                document.getElementById('username').classList.add('error');
                hasError = true;
            }

            if (!password) {
                showError('passwordError', 'Parol majburiy');
                document.getElementById('password').classList.add('error');
                hasError = true;
            }
            if (password.length < 6) {
                showError('passwordError', 'Parol kamida 6 ta belgidan iborat bo\'lishi kerak');
                document.getElementById('password').classList.add('error');
                hasError = true;
            }

            if (hasError) return;

            // Show loading
            form.style.display = 'none';
            loading.classList.add('active');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/users/admin/api/create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Show success
                    loading.classList.remove('active');
                    document.getElementById('displayUsername').textContent = data.admin.username;
                    document.getElementById('displayPassword').textContent = '•'.repeat(password.length);
                    successContainer.classList.add('active');

                    // Password toggle
                    let passwordVisible = false;
                    const toggleBtn = document.getElementById('togglePassword');
                    const displayField = document.getElementById('displayPassword');
                    
                    toggleBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        passwordVisible = !passwordVisible;
                        displayField.textContent = passwordVisible ? password : '•'.repeat(password.length);
                        toggleBtn.textContent = passwordVisible ? 'Yashirish' : 'Ko\'rsatish';
                    });

                    // Countdown
                    let countdown = 3;
                    const countdownElement = document.getElementById('countdown');
                    const countdownInterval = setInterval(() => {
                        countdown--;
                        countdownElement.textContent = Math.max(0, countdown);
                        if (countdown <= 0) {
                            clearInterval(countdownInterval);
                        }
                    }, 1000);

                    // Redirect
                    setTimeout(() => {
                        window.location.href = data.redirect_url || '/api/users/admin/dashboard/';
                    }, 3000);
                } else {
                    // Error
                    loading.classList.remove('active');
                    form.style.display = 'block';
                    const error = data.error || 'Noma\'lum xato';
                    showError('generalError', error);
                    submitBtn.disabled = false;
                }
            } catch (error) {
                loading.classList.remove('active');
                form.style.display = 'block';
                showError('generalError', 'Bog\'lanish xatosi: ' + error.message);
                submitBtn.disabled = false;
            }
        });

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('active');
        }
    </script>
</body>
</html>

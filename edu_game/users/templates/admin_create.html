<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Yaratish</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen">
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="w-full max-w-md">
            <!-- Card -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-8">
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="w-16 h-16 rounded-lg bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center mx-auto mb-4">
                        <svg width="32" height="32" viewBox="0 0 50 39" fill="none" xmlns="http://www.w3.org/2000/svg" class="fill-white">
                            <path d="M16.4992 2H37.5808L22.0816 24.9729H1L16.4992 2Z" />
                            <path d="M17.4224 27.102L11.4192 36H33.5008L49 13.0271H32.7024L23.2064 27.102H17.4224Z" />
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Edugame Admin Paneli</h1>
                    <p class="text-gray-600 dark:text-gray-400">Yangi admin yaratish</p>
                </div>

                <!-- Form -->
                <form id="adminForm" class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Username
                        </label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Admin username kiriting"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-slate-700 text-gray-900 dark:text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required
                        />
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Kamida 3 ta belgi</p>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Parol
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Kuchli parol kiriting"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-slate-700 text-gray-900 dark:text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required
                        />
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Kamida 6 ta belgi</p>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Parolni tasdiqlang
                        </label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Parolni qayta kiriting"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-slate-700 text-gray-900 dark:text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required
                        />
                    </div>

                    <!-- Error Message -->
                    <div id="errorMessage" class="hidden p-4 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
                        <p class="text-sm text-red-800 dark:text-red-300"></p>
                    </div>

                    <!-- Success Message -->
                    <div id="successMessage" class="hidden p-4 rounded-lg bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800">
                        <p class="text-sm text-green-800 dark:text-green-300 font-medium mb-2"></p>
                        <p class="text-xs text-green-700 dark:text-green-400 mb-3"></p>
                        <a href="/admin/" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-green-600 hover:bg-green-700 text-white font-medium transition-colors">
                            Admin Panelga kirish
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </a>
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full px-4 py-3 rounded-lg bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold transition-all duration-200 flex items-center justify-center gap-2"
                    >
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"></path>
                        </svg>
                        <span id="btnText">Admin Yaratish</span>
                    </button>
                </form>

                <!-- Info -->
                <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
                    <p class="text-xs text-gray-600 dark:text-gray-400 text-center">
                        Ushbu sahifa birinchi admin yaratish uchun foydalaniladi. <br/>
                        Keyingi adminlar Django admin paneldan yaratilishi mumkin.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('adminForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (username.length < 3) {
                showError('Username kamida 3 ta belgidan iborat bo\'lishi kerak');
                return;
            }

            if (password.length < 6) {
                showError('Parol kamida 6 ta belgidan iborat bo\'lishi kerak');
                return;
            }

            if (password !== confirmPassword) {
                showError('Parollar bir-biriga mos emas');
                return;
            }

            // Submit
            submitBtn.disabled = true;
            btnText.textContent = 'Yuklanmoqda...';

            try {
                const response = await fetch('/api/users/admin/api/create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    form.style.display = 'none';
                    successMessage.classList.remove('hidden');
                    successMessage.querySelector('p:first-of-type').textContent = '✓ Admin muvaffaqiyatli yaratildi!';
                    successMessage.querySelector('p:last-of-type').textContent = `Username: ${username}`;
                } else {
                    showError(data.error || 'Xato yuz berdi');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Admin Yaratish';
                }
            } catch (error) {
                showError('Server bilan aloqa yo\'q: ' + error.message);
                submitBtn.disabled = false;
                btnText.textContent = 'Admin Yaratish';
            }
        });

        function showError(message) {
            errorMessage.classList.remove('hidden');
            errorMessage.querySelector('p').textContent = '✗ ' + message;
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
